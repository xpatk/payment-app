<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="https://www.thymeleaf.org">

<head>
    <meta charset="UTF-8" />
    <title>Modifier profil</title>

    <style>
        * { box-sizing: border-box; }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f5f5;
        }

        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 60px;
            height: 80px;
            background: white;
            border-bottom: 1px solid #e5e5e5;
        }

        .navbar-brand {
            font-weight: bold;
            font-size: 18px;
        }

        .navbar-links {
            display: flex;
            align-items: center;
        }

        .navbar-links a,
        .logout-button {
            margin-left: 30px;
            text-decoration: none;
            color: black;
            font-size: 16px;
            background: none;
            border: none;
            cursor: pointer;
            font-family: inherit;
            padding: 0;
        }

        .page-container {
            padding: 100px 60px;
            display: flex;
            justify-content: center;
        }

        .edit-card {
            width: 600px;
        }

        .form-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }

        .form-label {
            font-weight: bold;
            font-size: 18px;
            width: 200px;
        }

        .form-input {
            width: 300px;
            height: 45px;
            border: 1px solid #ddd;
            border-radius: 8px;
            padding-left: 12px;
            font-size: 14px;
        }

        .primary-button {
            margin-top: 20px;
            padding: 14px 40px;
            background-color: #2c5bd1;
            border: none;
            border-radius: 8px;
            color: white;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
        }

        .secondary-button {
            margin-top: 20px;
            padding: 14px 40px;
            background-color: #f39c12;
            border: none;
            border-radius: 8px;
            color: white;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
        }

        .section-title {
            margin-top: 60px;
            margin-bottom: 20px;
            font-weight: bold;
            font-size: 18px;
        }

        .error {
            color: red;
            margin-bottom: 20px;
        }
    </style>
</head>

<body>

<div class="navbar">
    <div class="navbar-brand">Pay My Buddy</div>

    <div class="navbar-links">
        <a th:href="@{/transactions}">Transférer</a>
        <a th:href="@{/profile}">Profil</a>
        <a th:href="@{/connections}">Ajouter relation</a>

        <form th:action="@{/logout}" method="post">
            <input type="hidden"
                   th:name="${_csrf.parameterName}"
                   th:value="${_csrf.token}" />
            <button type="submit" class="logout-button">
                Se déconnecter
            </button>
        </form>
    </div>
</div>

<div class="page-container">

    <div class="edit-card">

        <div th:if="${error}" class="error">
            <span th:text="${error}"></span>
        </div>

        <form th:action="@{/profile/update}" method="post">

            <input type="hidden"
                   th:name="${_csrf.parameterName}"
                   th:value="${_csrf.token}" />

            <div class="form-row">
                <div class="form-label">Username</div>
                <input type="text"
                       name="username"
                       class="form-input"
                       th:value="${user.username}"
                       required />
            </div>

            <div class="form-row">
                <div class="form-label">Mail</div>
                <input type="email"
                       name="email"
                       class="form-input"
                       th:value="${user.email}"
                       required />
            </div>

            <button type="submit" class="primary-button">
                Enregistrer les modifications
            </button>

        </form>

        <div class="section-title">Changer le mot de passe</div>

        <form th:action="@{/profile/password}" method="post">

            <input type="hidden"
                   th:name="${_csrf.parameterName}"
                   th:value="${_csrf.token}" />

            <div class="form-row">
                <div class="form-label">Nouveau mot de passe</div>
                <input type="password"
                       name="password"
                       class="form-input"
                       required />
            </div>

            <button type="submit" class="secondary-button">
                Modifier le mot de passe
            </button>

        </form>

    </div>

</div>

</body>
</html>
