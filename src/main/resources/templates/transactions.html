<!DOCTYPE html>
<html lang="fr"
      xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="https://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Transactions</title>

    <style>
        body {
            font-size: 22px;
            font-family: sans-serif;
            margin: 0;
            background-color: #f5f5f5;
        }

        .header {
            display: flex;
            justify-content: space-between;
            width: 90%;
            margin: 40px auto;
        }

        a {
            text-decoration: none;
            color: black;
            margin-left: 40px;
        }

        .linkActive {
            color: #2c5bd1;
            font-weight: bold;
        }

        .bodyPlace {
            width: 80%;
            margin: 80px auto;
        }

        .transactionForm {
            background: white;
            padding: 40px;
            border-radius: 10px;
            margin-bottom: 60px;
        }

        select, input {
            height: 55px;
            border-radius: 10px;
            border: 1px solid #ededed;
            padding-left: 15px;
            font-size: 16px;
            margin-right: 20px;
        }

        select {
            width: 250px;
        }

        .descriptionInput {
            width: 300px;
        }

        .amountInput {
            width: 120px;
        }

        .btnPrimary {
            background-color: #2c5bd1;
            color: white;
            border: none;
            border-radius: 10px;
            height: 55px;
            width: 120px;
            cursor: pointer;
        }

        .transactionHistoric {
            background: white;
            padding: 30px;
            border-radius: 10px;
        }

        .transactionRow {
            display: flex;
            justify-content: space-between;
            border-bottom: 1px solid #f0f0f0;
            padding: 10px 0;
        }
    </style>
</head>

<body>

<div class="header">
    <p>Pay My Buddy</p>

    <nav>
        <a th:href="@{/transactions}" class="linkActive">Transférer</a>
        <a th:href="@{/profile}">Profil</a>
        <a th:href="@{/connections}">Relations</a>

        <form th:action="@{/logout}" method="post" style="display:inline;">
            <input type="hidden"
                   th:name="${_csrf.parameterName}"
                   th:value="${_csrf.token}" />
            <button type="submit"
                    style="background:none;border:none;margin-left:40px;cursor:pointer;">
                Se déconnecter
            </button>
        </form>
    </nav>
</div>

<div class="bodyPlace">

    <div th:if="${error}" style="color:red;">
        <p th:text="${error}"></p>
    </div>

    <div class="transactionForm">

        <form th:action="@{/transactions}" method="post">

            <input type="hidden"
                   th:name="${_csrf.parameterName}"
                   th:value="${_csrf.token}" />

            <select name="receiverEmail" required>
                <option value="">Sélectionner une relation</option>
                <option th:each="connection : ${connections}"
                        th:value="${connection.email}"
                        th:text="${connection.username}">
                </option>
            </select>

            <input class="descriptionInput"
                   type="text"
                   name="description"
                   placeholder="Description"
                   required />

            <input class="amountInput"
                   type="number"
                   name="amount"
                   placeholder="0 €"
                   step="0.01"
                   min="0.01"
                   required />

            <button class="btnPrimary" type="submit">
                Payer
            </button>

        </form>

    </div>

    <div class="transactionHistoric">
        <h3>Mes transactions</h3>

        <div th:each="transaction : ${transactions}"
             class="transactionRow">

            <div>
                <span th:text="${transaction.receiver.username}"></span>
                —
                <span th:text="${transaction.description}"></span>
            </div>

            <div>
                <strong th:text="${transaction.amount}"></strong> €
            </div>

        </div>
    </div>

</div>

</body>
</html>
