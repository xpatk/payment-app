<!DOCTYPE html>
<html lang="fr"
      xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="https://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Relations</title>

    <style>
        * { box-sizing: border-box; }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f5f5;
        }
        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 60px;
            height: 80px;
            background: white;
            border-bottom: 1px solid #e5e5e5;
        }

        .navbar-brand {
            font-weight: bold;
            font-size: 18px;
        }

        .navbar-links {
            display: flex;
            align-items: center;
        }

        .navbar-links a,
        .logout-button {
            margin-left: 30px;
            text-decoration: none;
            color: black;
            font-size: 16px;
            background: none;
            border: none;
            cursor: pointer;
            font-family: inherit;
            padding: 0;
        }

        .page-container {
            padding: 60px;
        }

        /* ===== RELATIONS STYLE ===== */

        .bodyPlace {
            width: 60%;
            margin: 0 auto;
        }

        .card {
            background: white;
            border: 1px solid #ededed;
            border-radius: 10px;
            padding: 40px;
            margin-bottom: 60px;
        }

        .cardTitle {
            font-weight: bold;
            margin-bottom: 30px;
        }

        input {
            width: 70%;
            height: 55px;
            border: 1px solid #ededed;
            border-radius: 10px;
            padding-left: 15px;
            margin-right: 20px;
            font-size: 16px;
        }

        .btnPrimary {
            background-color: #2c5bd1;
            color: white;
            border: none;
            border-radius: 10px;
            height: 55px;
            width: 150px;
            cursor: pointer;
            font-size: 16px;
        }

        .relationRow {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #f0f0f0;
            padding: 15px 0;
        }

        .relationRow:last-child {
            border-bottom: none;
        }

        .deleteBtn {
            background-color: #dc2626;
            color: white;
            border: none;
            border-radius: 8px;
            height: 40px;
            width: 100px;
            cursor: pointer;
        }

        .errorDiv {
            color: red;
            margin-bottom: 20px;
        }
    </style>
</head>

<body>

<!-- ===== NAVBAR ===== -->

<div class="navbar">
    <div class="navbar-brand">Pay My Buddy</div>

    <div class="navbar-links">
        <a th:href="@{/transactions}">Transférer</a>
        <a th:href="@{/profile}">Profil</a>
        <a th:href="@{/connections}">Ajouter relation</a>

        <form th:action="@{/logout}" method="post">
            <input type="hidden"
                   th:name="${_csrf.parameterName}"
                   th:value="${_csrf.token}" />
            <button type="submit" class="logout-button">
                Se déconnecter
            </button>
        </form>
    </div>
</div>

<!-- ===== CONTENT ===== -->

<div class="page-container">

    <div class="bodyPlace">

        <div class="errorDiv" th:if="${error}">
            <p th:text="${error}"></p>
        </div>

        <div class="card">
            <p class="cardTitle">Ajouter une relation</p>

            <form th:action="@{/connections/add}" method="post">

                <input type="hidden"
                       th:name="${_csrf.parameterName}"
                       th:value="${_csrf.token}" />

                <input type="email"
                       name="email"
                       placeholder="Email de la relation"
                       required>

                <button class="btnPrimary" type="submit">
                    Ajouter
                </button>

            </form>
        </div>

        <div class="card">

            <p class="cardTitle">Mes relations</p>

            <div th:if="${#lists.isEmpty(connections)}">
                <p>Aucune relation ajoutée.</p>
            </div>

            <div th:each="connection : ${connections}"
                 class="relationRow">

                <div>
                    <strong th:text="${connection.username}"></strong>
                    <span th:text="' (' + ${connection.email} + ')'"></span>
                </div>

                <form th:action="@{/connections/delete}" method="post">

                    <input type="hidden"
                           th:name="${_csrf.parameterName}"
                           th:value="${_csrf.token}" />

                    <input type="hidden"
                           name="email"
                           th:value="${connection.email}" />

                    <button class="deleteBtn" type="submit">
                        Supprimer
                    </button>

                </form>

            </div>

        </div>

    </div>

</div>

</body>
</html>
