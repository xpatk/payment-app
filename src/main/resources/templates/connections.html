<!DOCTYPE html>
<html lang="fr"
      xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="https://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Relations</title>

    <style>

        body {
            font-size: 20px;
            font-family: sans-serif;
            margin: 0;
            background-color: #f5f5f5;
        }

        /* HEADER */

        .header {
            display: flex;
            justify-content: space-between;
            width: 90%;
            margin: 40px auto;
        }

        a {
            text-decoration: none;
            color: black;
            margin-left: 40px;
        }

        .linkActive {
            color: #2c5bd1;
            font-weight: bold;
        }

        /* BODY */

        .bodyPlace {
            width: 60%;
            margin: 80px auto;
        }

        .card {
            background: white;
            border: 1px solid #ededed;
            border-radius: 10px;
            box-shadow: 0 0 0 1px #ededed;
            padding: 40px;
            margin-bottom: 60px;
        }

        .cardTitle {
            font-weight: bold;
            margin-bottom: 30px;
        }

        input {
            width: 70%;
            height: 55px;
            border: 1px solid #ededed;
            border-radius: 10px;
            box-shadow: 0 0 0 1px #ededed;
            padding-left: 15px;
            margin-right: 20px;
            font-size: 16px;
        }

        .btnPrimary {
            background-color: #2c5bd1;
            color: white;
            border: none;
            border-radius: 10px;
            height: 55px;
            width: 150px;
            cursor: pointer;
            font-size: 16px;
        }

        .relationRow {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #f0f0f0;
            padding: 15px 0;
        }

        .relationRow:last-child {
            border-bottom: none;
        }

        .deleteBtn {
            background-color: #dc2626;
            color: white;
            border: none;
            border-radius: 8px;
            height: 40px;
            width: 100px;
            cursor: pointer;
        }

        .errorDiv {
            color: red;
            margin-bottom: 20px;
        }

    </style>
</head>

<body>

<div class="header">
    <p>Pay My Buddy</p>

    <nav>
        <a th:href="@{/transactions}">Transférer</a>
        <a th:href="@{/profile}">Profil</a>
        <a th:href="@{/connections}" class="linkActive">Ajouter relation</a>

        <form th:action="@{/logout}" method="post" style="display:inline;">
            <input type="hidden"
                   th:name="${_csrf.parameterName}"
                   th:value="${_csrf.token}" />
            <button type="submit"
                    style="background:none;border:none;margin-left:40px;cursor:pointer;">
                Se déconnecter
            </button>
        </form>
    </nav>
</div>

<div class="bodyPlace">

    <!-- ERROR -->
    <div class="errorDiv" th:if="${error}">
        <p th:text="${error}"></p>
    </div>

    <!-- ADD CONNECTION -->
    <div class="card">
        <p class="cardTitle">Ajouter une relation</p>

        <form th:action="@{/connections/add}" method="post">

            <input type="hidden"
                   th:name="${_csrf.parameterName}"
                   th:value="${_csrf.token}" />

            <input type="email"
                   name="email"
                   placeholder="Email de la relation"
                   required>

            <button class="btnPrimary" type="submit">
                Ajouter
            </button>

        </form>
    </div>

    <!-- CONNECTION LIST -->
    <div class="card">

        <p class="cardTitle">Mes relations</p>

        <div th:if="${#lists.isEmpty(connections)}">
            <p>Aucune relation ajoutée.</p>
        </div>

        <div th:each="connection : ${connections}"
             class="relationRow">

            <div>
                <strong th:text="${connection.username}"></strong>
                <span th:text="' (' + ${connection.email} + ')'"></span>
            </div>

            <form th:action="@{/connections/delete}" method="post">

                <input type="hidden"
                       th:name="${_csrf.parameterName}"
                       th:value="${_csrf.token}" />

                <input type="hidden"
                       name="email"
                       th:value="${connection.email}" />

                <button class="deleteBtn" type="submit">
                    Supprimer
                </button>

            </form>

        </div>

    </div>

</div>

</body>
</html>
