<!DOCTYPE html>
<html lang="fr"
      xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="https://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Profil</title>

    <style>

        body {
            font-size: 20px;
            font-family: sans-serif;
            margin: 0;
            background-color: #f5f5f5;
        }

        /* HEADER */

        .header {
            display: flex;
            justify-content: space-between;
            width: 90%;
            margin: 40px auto;
        }

        a {
            text-decoration: none;
            color: black;
            margin-left: 40px;
        }

        .linkActive {
            color: #2c5bd1;
            font-weight: bold;
        }

        /* BODY */

        .bodyPlace {
            width: 60%;
            margin: 80px auto;
        }

        .card {
            background: white;
            border: 1px solid #ededed;
            border-radius: 10px;
            box-shadow: 0 0 0 1px #ededed;
            padding: 40px;
            margin-bottom: 60px;
        }

        .cardTitle {
            font-weight: bold;
            margin-bottom: 30px;
        }

        input {
            width: 100%;
            height: 55px;
            border: 1px solid #ededed;
            border-radius: 10px;
            box-shadow: 0 0 0 1px #ededed;
            padding-left: 15px;
            margin-bottom: 25px;
            font-size: 16px;
        }

        .btnPrimary {
            background-color: #2c5bd1;
            color: white;
            border: none;
            border-radius: 10px;
            height: 55px;
            width: 180px;
            cursor: pointer;
            font-size: 16px;
        }

        .errorDiv {
            color: red;
            margin-bottom: 20px;
        }

        .successDiv {
            color: green;
            margin-bottom: 20px;
        }

    </style>
</head>

<body>

<div class="header">
    <p>Pay My Buddy</p>

    <nav>
        <a th:href="@{/transactions}">Transférer</a>
        <a th:href="@{/profile}" class="linkActive">Profil</a>
        <a th:href="@{/connections}">Ajouter relation</a>

        <form th:action="@{/logout}" method="post" style="display:inline;">
            <input type="hidden"
                   th:name="${_csrf.parameterName}"
                   th:value="${_csrf.token}" />
            <button type="submit"
                    style="background:none;border:none;margin-left:40px;cursor:pointer;">
                Se déconnecter
            </button>
        </form>
    </nav>
</div>

<div class="bodyPlace">

    <!-- ERROR -->
    <div class="errorDiv" th:if="${error}">
        <p th:text="${error}"></p>
    </div>

    <!-- PASSWORD CHANGED MESSAGE -->
    <div class="successDiv" th:if="${param.passwordChanged}">
        Mot de passe modifié avec succès. Veuillez vous reconnecter.
    </div>

    <!-- PROFILE UPDATE -->
    <div class="card">

        <p class="cardTitle">Mes informations</p>

        <form th:action="@{/profile/update}" method="post">

            <input type="hidden"
                   th:name="${_csrf.parameterName}"
                   th:value="${_csrf.token}" />

            <input type="text"
                   name="username"
                   th:value="${user.username}"
                   placeholder="Username"
                   required>

            <input type="email"
                   name="email"
                   th:value="${user.email}"
                   placeholder="Email"
                   required>

            <button class="btnPrimary" type="submit">
                Mettre à jour
            </button>

        </form>

    </div>

    <!-- PASSWORD UPDATE -->
    <div class="card">

        <p class="cardTitle">Changer le mot de passe</p>

        <form th:action="@{/profile/password}" method="post">

            <input type="hidden"
                   th:name="${_csrf.parameterName}"
                   th:value="${_csrf.token}" />

            <input type="password"
                   name="password"
                   placeholder="Nouveau mot de passe"
                   required>

            <button class="btnPrimary" type="submit">
                Modifier mot de passe
            </button>

        </form>

    </div>

</div>

</body>
</html>
