<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="https://www.thymeleaf.org">

<head>
    <meta charset="UTF-8" />
    <title>Profil</title>

    <style>
        * { box-sizing: border-box; }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f5f5;
        }

        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 60px;
            height: 80px;
            background: white;
            border-bottom: 1px solid #e5e5e5;
        }

        .navbar-brand {
            font-weight: bold;
            font-size: 18px;
        }

        .navbar-links {
            display: flex;
            align-items: center;
        }

        .navbar-links a,
        .logout-button {
            margin-left: 30px;
            text-decoration: none;
            color: black;
            font-size: 16px;
            background: none;
            border: none;
            cursor: pointer;
            font-family: inherit;
            padding: 0;
        }

        .page-container {
            padding: 100px 60px;
            display: flex;
            justify-content: center;
        }

        .profile-content {
            width: 600px;
        }

        .profile-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 30px;
            font-size: 18px;
        }

        .profile-label {
            font-weight: bold;
        }

        .modify-button {
            margin-top: 40px;
            padding: 14px 40px;
            background-color: #f39c12;
            border: none;
            border-radius: 8px;
            color: white;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
        }

        .modify-wrapper {
            display: flex;
            justify-content: flex-end;
        }
    </style>
</head>

<body>

<div class="navbar">
    <div class="navbar-brand">Pay My Buddy</div>

    <div class="navbar-links">
        <a th:href="@{/transactions}">Transférer</a>
        <a th:href="@{/profile}">Profil</a>
        <a th:href="@{/connections}">Ajouter relation</a>

        <form th:action="@{/logout}" method="post">
            <input type="hidden"
                   th:name="${_csrf.parameterName}"
                   th:value="${_csrf.token}" />
            <button type="submit" class="logout-button">
                Se déconnecter
            </button>
        </form>
    </div>
</div>

<div class="page-container">

    <div class="profile-content">

        <div class="profile-row">
            <div class="profile-label">Username</div>
            <div th:text="${user.username}">@username</div>
        </div>

        <div class="profile-row">
            <div class="profile-label">Mail</div>
            <div th:text="${user.email}">nom@domain.com</div>
        </div>

        <div class="profile-row">
            <div class="profile-label">Mot de passe</div>
            <div>********</div>
        </div>

        <div class="modify-wrapper">
            <form th:action="@{/profile/edit}" method="get">
                <button type="submit" class="modify-button">
                    Modifier
                </button>
            </form>
        </div>

    </div>

</div>

</body>
</html>
