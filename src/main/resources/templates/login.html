<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="https://www.thymeleaf.org">
<head>
    <title>Pay My Buddy - Login</title>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: white;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .login-card {
            background: white;
            padding: 40px;
            width: 350px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15);
        }

        .title {
            width: 70%;
            margin: 0 auto 24px auto;
            padding: 10px;
            background-color: #e58b46;
            border-radius: 8px;
            color: white;
            font-weight: bold;
            text-align: center;
            font-size: 24px;
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-group input {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #ddd;
            font-size: 14px;
        }

        .form-group input:focus {
            outline: none;
            border-color: #6366f1;
        }

        .login-button {
            width: 100%;
            padding: 12px;
            background-color: #2c5bd1;
            border: none;
            border-radius: 8px;
            color: white;
            font-weight: bold;
            cursor: pointer;
        }

        .login-button:hover {
            background-color: #4338ca;
        }

        .message {
            font-size: 13px;
            margin-bottom: 16px;
            text-align: center;
        }

        .error {
            color: #dc2626;
        }

        .logout {
            color: #16a34a;
        }
    </style>
</head>

<body>

<div class="login-card">

    <h1 class="title">Pay My Buddy</h1>

    <div th:if="${param.error}" class="message error">
        Email ou mot de passe incorrect.
    </div>

    <div th:if="${param.logout}" class="message logout">
        You have been logged out.
    </div>

    <form th:action="@{/login}" method="post">

        <input type="hidden"
               th:if="${_csrf != null}"
               th:name="${_csrf.parameterName}"
               th:value="${_csrf.token}" />

        <div class="form-group">
            <input type="email"
                   name="username"
                   placeholder="E-mail"
                   autocomplete="username"
                   required />
        </div>

        <div class="form-group">
            <input type="password"
                   name="password"
                   placeholder="Mot de passe"
                   autocomplete="current-password"
                   required />
        </div>

        <button type="submit" class="login-button">
            Se connecter
        </button>

    </form>

</div>

</body>
</html>
